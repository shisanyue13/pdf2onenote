<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img"
     aria-label="原理：四级降级、两条缩进聚类规则、页码偏移与文件命名">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0 0 L7 3.2 L0 6.4 Z" fill="#333"/>
    </marker>
    <style>
      .t { font-family:"Microsoft YaHei","Noto Sans SC",sans-serif; fill:#1a1a1a; }
      .d { font-family:"Microsoft YaHei","Noto Sans SC",sans-serif; fill:#5a5a5a; }
      .k { font-family:"Microsoft YaHei","Noto Sans SC",sans-serif; fill:#111; font-weight:600; }
      .m { font-family:Consolas,"Cascadia Mono",monospace; fill:#111; }
      .h { font-family:Georgia,"Songti SC",serif; fill:#111; letter-spacing:.1em; }
    </style>
  </defs>

  <rect x="0" y="0" width="940" height="470" rx="10" fill="#ffffff" stroke="#cfcfcf"/>
  <text class="h" x="28" y="40" font-size="16">原理一页纸</text>
  <line x1="28" y1="52" x2="96" y2="52" stroke="#111" stroke-width="2"/>

  <!-- 左：四级降级 -->
  <text class="k" x="30" y="80" font-size="12.5">① 四级降级：从上往下试，成功就停</text>

  <rect x="30" y="92" width="392" height="40" rx="6" fill="#111" stroke="#111"/>
  <text x="44" y="117" font-size="11" fill="#ffffff"
        font-family="Microsoft YaHei,Noto Sans SC,sans-serif">1 · PDF 书签 outline（最准，有就用）</text>

  <path d="M226 132v14" stroke="#333" stroke-width="1.4" marker-end="url(#a2)"/>

  <rect x="30" y="146" width="392" height="40" rx="6" fill="#f7f7f7" stroke="#333"/>
  <text class="t" x="44" y="171" font-size="11">2 · 文本层目录页（缩进聚类 + 页码偏移）</text>

  <path d="M226 186v14" stroke="#333" stroke-width="1.4" marker-end="url(#a2)"/>

  <rect x="30" y="200" width="392" height="40" rx="6" fill="#f7f7f7" stroke="#333"/>
  <text class="t" x="44" y="225" font-size="11">3 · OCR 目录页（扫描件；需 rapidocr）</text>

  <path d="M226 240v14" stroke="#333" stroke-width="1.4" marker-end="url(#a2)"/>

  <rect x="30" y="254" width="392" height="40" rx="6" fill="#ffffff" stroke="#bdbdbd" stroke-dasharray="4 3"/>
  <text class="t" x="44" y="279" font-size="11">4 · 固定页数兜底（每 N 页一刀）</text>

  <text class="d" x="30" y="318" font-size="10.5">每级都要求「至少 2 个条目」才采用，否则继续往下退。</text>

  <!-- 右：两条规则 -->
  <text class="k" x="460" y="80" font-size="12.5">② 目录行怎么判层级：两条互补规则</text>

  <rect x="460" y="92" width="452" height="96" rx="6" fill="#f7f7f7" stroke="#333"/>
  <text class="k" x="474" y="114" font-size="11.5">多缩进层级（章比节更靠左）</text>
  <text class="d" x="474" y="134" font-size="10.5">按左边界 x 聚类 → 取最左「含章样条目」的簇为章；</text>
  <text class="d" x="474" y="152" font-size="10.5">右栏章号与之〔不重叠〕 → 视为双栏续章保留</text>
  <text class="m" x="474" y="174" font-size="9.5" fill="#8a8a8a">x=72 章 1-4 ｜ x=144 章 5-8</text>

  <rect x="460" y="200" width="452" height="96" rx="6" fill="#f7f7f7" stroke="#333"/>
  <text class="k" x="474" y="222" font-size="11.5">单缩进层级（整本左对齐）</text>
  <text class="d" x="474" y="242" font-size="10.5">只留章样条目（第X章 / Chapter N / 附录 / 索引…）；</text>
  <text class="d" x="474" y="260" font-size="10.5">N.M 小节、重复出现 ≥3 次的行、前言类一律剔除</text>
  <text class="m" x="474" y="282" font-size="9.5" fill="#8a8a8a">「第X章」≥3 个 → 直接按显式章标记筛选</text>

  <!-- 底部 -->
  <text class="k" x="30" y="356" font-size="12.5">③ 页码偏移与命名</text>

  <rect x="30" y="368" width="392" height="46" rx="6" fill="#ffffff" stroke="#333"/>
  <text class="m" x="44" y="388" font-size="11">PDF 页 = 印刷页 + offset</text>
  <text class="d" x="44" y="405" font-size="10.5">offset 由正文页脚角标投票得出；读不到时退化为「目录末页 + 1」</text>

  <rect x="460" y="368" width="452" height="46" rx="6" fill="#ffffff" stroke="#333"/>
  <text class="m" x="474" y="388" font-size="11">00_ 前置页 ｜ 01_ 章 ｜ 01-1_ 节 ｜ 91_ 附页</text>
  <text class="d" x="474" y="405" font-size="10.5">重名自动加 _2；标题自带的章号与文件号相同时去掉</text>
</svg>
