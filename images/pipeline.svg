<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img"
     aria-label="整体流程：教材 PDF → 识别章节目录 → 按章切分 → 导入 OneNote">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0 0 L7 3.2 L0 6.4 Z" fill="#333"/>
    </marker>
    <style>
      .t { font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif; fill:#1a1a1a; }
      .d { font-family:"Microsoft YaHei","Noto Sans SC",sans-serif; fill:#5a5a5a; }
      .k { font-family:"Microsoft YaHei","Noto Sans SC",sans-serif; fill:#111; font-weight:600; }
      .m { font-family:Consolas,"Cascadia Mono",monospace; fill:#111; }
      .h { font-family:Georgia,"Songti SC",serif; fill:#111; letter-spacing:.1em; }
    </style>
  </defs>

  <rect x="0" y="0" width="940" height="300" rx="10" fill="#ffffff" stroke="#cfcfcf"/>
  <text class="h" x="30" y="42" font-size="17">pdf2onenote · 整体流程</text>
  <line x1="30" y1="54" x2="120" y2="54" stroke="#111" stroke-width="2"/>

  <!-- 1 -->
  <rect x="30" y="86" width="180" height="150" rx="8" fill="#f7f7f7" stroke="#333"/>
  <rect x="60" y="104" width="52" height="66" rx="2" fill="#ffffff" stroke="#333"/>
  <rect x="68" y="112" width="22" height="3" rx="1.5" fill="#111"/>
  <g stroke="#8a8a8a" stroke-width="1.6" stroke-linecap="round">
    <path d="M68 122h36"/><path d="M68 129h30"/><path d="M68 136h34"/><path d="M68 143h22"/>
  </g>
  <path d="M112 118h26v72H74" fill="none" stroke="#bdbdbd"/>
  <text class="k" x="120" y="196" font-size="13">教材 PDF</text>
  <text class="d" x="120" y="214" font-size="10.5">扫描件 / 电子版 / 汇编</text>

  <path d="M218 161h44" stroke="#333" stroke-width="1.6" marker-end="url(#a1)" stroke-dasharray="5 4"/>

  <!-- 2 -->
  <rect x="270" y="86" width="230" height="150" rx="8" fill="#f7f7f7" stroke="#333"/>
  <text class="k" x="286" y="112" font-size="12">① 识别章节目录</text>
  <g class="t" font-size="10.5">
    <text x="286" y="134">书签 outline</text>
    <text x="286" y="150">文本层目录页</text>
    <text x="286" y="166">OCR 目录页</text>
    <text x="286" y="182">固定页数兜底</text>
  </g>
  <g stroke="#333" stroke-width="1" fill="none">
    <path d="M366 130h18" marker-end="url(#a1)"/>
    <path d="M366 146h18" marker-end="url(#a1)"/>
    <path d="M366 162h18" marker-end="url(#a1)"/>
  </g>
  <text class="d" x="392" y="134" font-size="9.5">命中即停</text>
  <text class="d" x="392" y="162" font-size="9.5">越靠上越准</text>
  <text class="m" x="286" y="210" font-size="9.5">PDF 页 = 印刷页 + offset</text>

  <path d="M508 161h44" stroke="#333" stroke-width="1.6" marker-end="url(#a1)" stroke-dasharray="5 4"/>

  <!-- 3 -->
  <rect x="560" y="86" width="150" height="150" rx="8" fill="#f7f7f7" stroke="#333"/>
  <text class="k" x="576" y="112" font-size="12">② 按章 / 章+节切</text>
  <g class="m" font-size="9.5">
    <text x="576" y="138">00_前置页.pdf</text>
    <text x="576" y="156">01_导论.pdf</text>
    <text x="576" y="174" fill="#5a5a5a">01-1_小节.pdf</text>
    <text x="576" y="192">02_基本概念.pdf</text>
    <text x="576" y="210" fill="#5a5a5a">…</text>
    <text x="576" y="228" fill="#5a5a5a">91_参考文献.pdf</text>
  </g>

  <path d="M718 161h44" stroke="#333" stroke-width="1.6" marker-end="url(#a1)" stroke-dasharray="5 4"/>

  <!-- 4 -->
  <rect x="770" y="86" width="140" height="150" rx="8" fill="#111" stroke="#111"/>
  <rect x="790" y="104" width="100" height="76" rx="3" fill="#ffffff" stroke="#111"/>
  <path d="M790 118h100" stroke="#111"/>
  <g stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round">
    <path d="M800 130h80"/><path d="M800 141h56"/><path d="M800 152h70"/>
  </g>
  <text x="840" y="204" font-size="13" text-anchor="middle" fill="#ffffff"
        font-family="Microsoft YaHei,Noto Sans SC,sans-serif">导入 OneNote</text>
  <text x="840" y="222" font-size="10.5" text-anchor="middle" fill="#d0d0d0"
        font-family="Microsoft YaHei,Noto Sans SC,sans-serif">一章一页 · 可搜索</text>

  <text class="d" x="30" y="272" font-size="10.5">切分不改变页面像素，只是把同一份 PDF 按页区间重新装箱；导入是把每页渲染成图片放进新页面。</text>
</svg>
